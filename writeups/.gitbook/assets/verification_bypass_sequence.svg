<svg width="720" height="520" viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sequence diagram of the domain verification bypass</title>
<desc>Sequence diagram with three lifelines: the verification scanner, the attacker's application, and an external out-of-scope host. The scanner requests the root path, receives the verification token, and marks the domain verified. It then requests another path, receives a 302 redirect to the external host, and follows it without re-checking scope, completing the bypass against a domain the attacker does not own.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .actor-t { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .actor-s { font-size: 11px; fill: #5F5E5A; }
  .msg { font-size: 12px; fill: #2C2C2A; }
  .msg-bad { font-size: 12px; fill: #993C1D; font-weight: 600; }
  .note { font-size: 11.5px; fill: #085041; }
  .lifeline { stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 3 3; }
  .arr { stroke: #5F5E5A; stroke-width: 1.4; fill: none; }
  .arr-bad { stroke: #993C1D; stroke-width: 1.8; fill: none; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="720" height="520" fill="#ffffff"/>

<text class="actor-t" x="360" y="26" text-anchor="middle">Verification bypass — sequence</text>

<!-- Actor boxes -->
<rect x="60" y="45" width="160" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="actor-t" x="140" y="65" text-anchor="middle" fill="#042C53">Scanner</text>
<text class="actor-s" x="140" y="80" text-anchor="middle" fill="#0C447C">verification service</text>

<rect x="300" y="45" width="160" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="actor-t" x="380" y="65" text-anchor="middle" fill="#4A1B0C">Attacker app</text>
<text class="actor-s" x="380" y="80" text-anchor="middle" fill="#712B13">submitted as target</text>

<rect x="540" y="45" width="160" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="actor-t" x="620" y="65" text-anchor="middle" fill="#2C2C2A">External host</text>
<text class="actor-s" x="620" y="80" text-anchor="middle" fill="#5F5E5A">out of scope</text>

<!-- Lifelines -->
<line x1="140" y1="91" x2="140" y2="500" class="lifeline"/>
<line x1="380" y1="91" x2="380" y2="500" class="lifeline"/>
<line x1="620" y1="91" x2="620" y2="500" class="lifeline"/>

<!-- 1: GET / -->
<line x1="140" y1="120" x2="378" y2="120" class="arr" marker-end="url(#arrow)"/>
<text class="msg" x="260" y="112" text-anchor="middle">1. GET /</text>

<!-- 2: 200 + token -->
<line x1="380" y1="150" x2="142" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="msg" x="260" y="142" text-anchor="middle">2. 200 OK + token comment</text>

<!-- note: verified -->
<rect x="70" y="165" width="140" height="30" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text class="note" x="140" y="184" text-anchor="middle">domain marked verified</text>

<!-- 3: GET /assets/x -->
<line x1="140" y1="230" x2="378" y2="230" class="arr" marker-end="url(#arrow)"/>
<text class="msg" x="260" y="222" text-anchor="middle">3. GET /assets/x</text>

<!-- 4: 302 redirect (bad) -->
<line x1="380" y1="260" x2="142" y2="260" class="arr-bad" marker-end="url(#arrow-bad)"/>
<text class="msg-bad" x="260" y="252" text-anchor="middle">4. 302 → external host</text>

<!-- note: no re-check -->
<rect x="230" y="270" width="220" height="30" rx="6" fill="#F0997B" stroke="#993C1D" stroke-width="0.75"/>
<text class="msg-bad" x="340" y="289" text-anchor="middle">scope not re-checked here</text>

<!-- 5: scanner follows redirect -->
<line x1="140" y1="330" x2="618" y2="330" class="arr-bad" marker-end="url(#arrow-bad)"/>
<text class="msg-bad" x="380" y="322" text-anchor="middle">5. follows redirect → scans external host</text>

<!-- 6: response from external host -->
<line x1="620" y1="360" x2="142" y2="360" class="arr" marker-end="url(#arrow)"/>
<text class="msg" x="380" y="352" text-anchor="middle">6. 200 OK (unrelated content)</text>

<!-- final note -->
<rect x="60" y="400" width="600" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="msg-bad" x="80" y="424">Result: verdict from step 2 still stands.</text>
<text class="msg" x="80" y="444" fill="#4A1B0C">Attacker gets a "verified" scan against a host they never proved ownership of.</text>

</svg>
